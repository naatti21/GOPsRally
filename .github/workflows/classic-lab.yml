name: Classic sandbox regressions — NO DEPLOY
on:
  pull_request:
    paths:
      - 'game.js'
      - 'renderer3d.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/classic-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Baseline game smoke test
        run: node tests/smoke-test.cjs
      - name: Native WebGL2 smoke test
        run: node tests/3d-smoke-test.cjs
      - name: Classic turn/slip/recovery regression
        run: node tests/classic-feel.cjs
      - name: Bundle isolated single-file Android test
        run: node scripts/classic-single-file.cjs
      - name: Archive test file (never deploy)
        uses: actions/upload-artifact@v4
        with:
          name: classic-rally-android-single-file
          path: dist/classic-rally-test.html
          if-no-files-found: error
          retention-days: 7
