name: v0.4 foundation checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Draw-line physics metrics (real Rapier, deterministic)
        run: |
          node scripts/physics-line-lab.mjs > draw-line-report.json
          cat draw-line-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: draw-line-physics-metrics
          path: draw-line-report.json
          retention-days: 14
      - name: Compare equal-start corner lines and exit performance
        run: |
          node scripts/corner-line-benchmark.mjs > corner-benchmark.json
          cat corner-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: racing-line-corner-results
          path: corner-benchmark.json
          retention-days: 14
      - name: Steering-only drift and contact-force telemetry
        run: npm run --silent lab:drift > arcade-drift-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: arcade-drift-metrics
          path: arcade-drift-report.json
          retention-days: 14
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real Chromium rendering and offline tests
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from '@playwright/test';console.log(chromium.executablePath())")"
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-browser-evidence
          path: test-results/

      - name: Package isolated v0.4 browser preview
        uses: actions/upload-artifact@v4
        with:
          name: gops-rally-v04-preview-site
          path: dist/v04/
          if-no-files-found: error
          retention-days: 7
