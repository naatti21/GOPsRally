<script>/* GOPsRally 3D contact experiment v2: three actual road shapes, two directions.
 * This is a constrained suspension/body test. Longitudinal movement is scripted
 * along the centerline, NOT a complete steering or lateral grip model.
 * Road drawing and wheel suspension sample the same triangulated mesh. */
(function(root,factory){const out=factory();if(typeof module==='object'&&module.exports)module.exports=out;root.CrestProof=out;})(typeof globalThis!=='undefined'?globalThis:this,()=>{
'use strict';
const clamp=(a,l,h)=>Math.max(l,Math.min(h,a));
const mix=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const DZ=.75,Z0=-220,Z1=220,HALF=9.5;
const settings={
 soft:{name:'LOIVA HARJANNE',detail:'Loiva kumpu: matalampi, nopeudesta riippuva keveneminen'},
 jump:{name:'HYPPYRI',detail:'Jyrkempi tien oma harjanne: ilmassaolo ja laskeutuminen'},
 bank:{name:'KALLISTETTU MUTKA',detail:'Kaareva tie ja fyysinen poikittaiskallistus'}
};
function centered(z){return 29*smooth((z+74)/148);}
function centeredD(z){const u=(z+74)/148;return u>0&&u<1?29*6*u*(1-u)/148:0;}
const shape={
 soft:{cx:z=>0,dx:z=>0,height:z=>3.9*Math.exp(-((z/40)**2)),bank:z=>0},
 jump:{cx:z=>0,dx:z=>0,height:z=>6.1*Math.exp(-((z/34)**2)),bank:z=>0},
 bank:{cx:centered,dx:centeredD,height:z=>.85*Math.sin(z/63),bank:z=>.235*smooth((z+82)/46)*(1-smooth((z-28)/55))}
};
const scenarioCache=new Map();
function roadFor(name='soft'){
 if(scenarioCache.has(name))return scenarioCache.get(name);
 const f=shape[name];if(!f)throw Error('Tuntematon koe: '+name);
 const levels=[];
 for(let i=0;i<=Math.round((Z1-Z0)/DZ);i++){
  const z=Z0+i*DZ,cx=f.cx(z),der=f.dx(z),n=1/Math.hypot(1,der);
  const row={z,cx,der,nx:n,nz:-der*n,y:f.height(z),bank:f.bank(z)};
  row.vertex=offset=>[row.cx+row.nx*offset,row.y+row.bank*offset,row.z+row.nz*offset];

 // Height lookup is barycentric interpolation of the EXACT road mesh triangles.
 // The renderer draws the same triangles (no independently sampled visual road).
 const bary=(a,b,c,x,z)=>{
  const det=(b[2]-c[2])*(a[0]-c[0])+(c[0]-b[0])*(a[2]-c[2]);
  if(Math.abs(det)<1e-10)return null;
  const w1=((b[2]-c[2])*(x-c[0])+(c[0]-b[0])*(z-c[2]))/det;
  const w2=((c[2]-a[2])*(x-c[0])+(a[0]-c[0])*(z-c[2]))/det;
  const w3=1-w1-w2;
  if(w1<-.000005||w2<-.000005||w3<-.000005)return null;

 };

  const start=clamp(Math.floor((z-Z0)/DZ),0,levels.length-2);
  for(let delta=0;delta<=13;delta++)for(const idx of delta===0?[start]:[start-delta,start+delta]){
   if(idx<0||idx>=levels.length-1)continue;
   const a=levels[idx],b=levels[idx+1];
   // match renderer.meshBuilder.quad: tri(A,C,B) and tri(A,D,C)

  }

  return {y:null,inside:false,segment:-1};
 }
 function centerY(z){const c=f.cx(z);const hit=query(c,z);return hit.inside?hit.y:f.height(clamp(z,Z0,Z1));}
 function slope(z){return (centerY(z+.45)-centerY(z-.45))/.90;}
 const out={name,levels,Z0,Z1,DZ,ROAD_HALF:HALF,centerX:f.cx,derivative:f.dx,surface:(x,z)=>query(x,z).y,query,centerY,slope,bank:f.bank,rowAt:z=>levels[clamp(Math.round((z-Z0)/DZ),0,levels.length-1)]};

const MASS=930,GRAV=9.81,K=37000,C=3900,REST=.43,MAX_LEN=.74,RADIUS=.48,MOUNT=-.18;
const PITCH_INERTIA=1840,ROLL_INERTIA=1460;
const WHEELS=[{side:-1.47,front:-2.2},{side:1.47,front:-2.2},{side:-1.47,front:2.2},{side:1.47,front:2.2}];
const DT=1/120;
function fresh({scenario='soft',speed=150,reverse=false}={}){

 const vel=speed/(3.6*.8),slope=road.slope(z),bank=road.bank(z),cx=road.centerX(z);
 return {scenario,displaySpeed:speed,reverse,road,dir,speed:vel,x:cx,z,
  heading:Math.atan(road.derivative(z))+(reverse?Math.PI:0),
  y:road.centerY(z)+1.08,vy:slope*vel*dir,pitch:-Math.atan(slope)*dir,roll:Math.atan(bank),pitchV:0,rollV:0,

  takeoffs:0,landings:0,maxGap:0,airSeconds:0,currentAirSeconds:0,maxAirDuration:0,totalSeconds:0,

function step(s){

 for(let i=0;i<WHEELS.length;i++){
  const w=WHEELS[i],f=w.front,wx=s.x+w.side*rightX+f*forwardX,wz=s.z+w.side*rightZ+f*forwardZ;

  const groundNext=ground.inside?road.query(wx+road.derivative(s.z)*dTravel,wz+dTravel):null;

  if(ground.inside&&length<REST){

   if(force>.5)contacts++;

  s.forces[i]=force;s.wheelLengths[i]=clamp(length,.06,MAX_LEN);

 }
 const was=s.airborne;
 s.contacts=contacts;
 // Suppress zero-load oscillation while every wheel remains near the road.
 // Takeoff requires both loss of tyre support and measurable clearance.
 const centerGap=Math.max(0,s.y-1.08-road.centerY(s.z));

 else{if(was){s.landings++;s.lastLandingTime=s.totalSeconds;s.maxAirDuration=Math.max(s.maxAirDuration,s.currentAirSeconds);s.landed=true;}s.currentAirSeconds=0;}
 s.minPenetration=Math.min(s.minPenetration,wheelLowest);
 const roadY=road.centerY(s.z);
 const gap=Math.max(0,s.y-1.08-roadY);
 s.maxGap=Math.max(s.maxGap,gap);
 s.vy+=total/MASS*DT;s.y+=s.vy*DT;
 s.pitchV=clamp(s.pitchV+torquePitch/PITCH_INERTIA*DT,-2.6,2.6);
 s.rollV=clamp(s.rollV+torqueRoll/ROLL_INERTIA*DT,-2.6,2.6);
 s.pitch=clamp(s.pitch+s.pitchV*DT,-.7,.7);
 s.roll=clamp(s.roll+s.rollV*DT,-.55,.55);
 s.maxPitch=Math.max(s.maxPitch,Math.abs(s.pitch));s.maxRoll=Math.max(s.maxRoll,Math.abs(s.roll));

}
function simulate(scenario='soft',speed=150,reverse=false,maxSeconds=18){
 const s=fresh({scenario,speed,reverse});
 for(let i=0;i<Math.floor(maxSeconds/DT);i++){
  step(s);
  if(i%12===0)s.history.push({t:s.totalSeconds,z:s.z,x:s.x,gap:s.y-1.08-s.road.centerY(s.z),pitch:s.pitch,roll:s.roll,contacts:s.contacts});
  if(Math.abs(s.z)>177)break;
 }
 s.maxAirDuration=Math.max(s.maxAirDuration,s.currentAirSeconds);

}
const road=roadFor('soft');

});
</script>
<script>

/* GOPs Rally — native WebGL2 3D scene, no CDN or runtime dependencies.
 * Terrain, banked road, vegetation, chassis and four independent wheels use real 3D geometry.
 * Arcade dynamics remain the responsibility of game.js; suspension is a visual response model.
 */
(() => {
'use strict';
const canvas = document.getElementById('scene3d');
const forceCanvas = false;
const gl = forceCanvas ? null : canvas?.getContext('webgl2', {antialias:false,alpha:false,powerPreference:'high-performance'});
if (!gl) { document.documentElement.classList.add('no-webgl'); return; }
const vs = `#version 300 es
precision highp float;
in vec3 aPos; in vec3 aNormal; in vec3 aColor;
uniform mat4 uProj,uView,uModel;
out vec3 vColor; out float vFog;
void main(){
 vec4 eye=uView*uModel*vec4(aPos,1.);
 vec3 n=normalize(mat3(uModel)*aNormal);
 float sun=max(.0,dot(n,normalize(vec3(-.44,.88,.19))));
 vColor=aColor*(.60+.40*sun);
 vFog=clamp((-eye.z-125.)/490.,0.,.48);
 gl_Position=uProj*eye;
}`;
const fs = `#version 300 es
precision mediump float;
in vec3 vColor; in float vFog; out vec4 frag;
void main(){ frag=vec4(mix(vColor,vec3(.23,.31,.27),vFog),1.); }`;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}

const loc={pos:gl.getAttribLocation(program,'aPos'),normal:gl.getAttribLocation(program,'aNormal'),color:gl.getAttribLocation(program,'aColor'),projection:gl.getUniformLocation(program,'uProj'),view:gl.getUniformLocation(program,'uView'),model:gl.getUniformLocation(program,'uModel')};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

function yaw(t){const m=identity(),c=Math.cos(t),s=Math.sin(t);m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m;}
function roll(t){const m=identity(),c=Math.cos(t),s=Math.sin(t);m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m;}

 car:[.96,.29,.12],hood:[.98,.54,.12],roof:[.98,.91,.70],glass:[.10,.22,.28],rubber:[.065,.07,.07],stripe:[.94,.91,.71]

function makeTerrain(roadModel){

 // precise piecewise-planar banked/curved surface.

const car=meshBuilder();
car.box(0,-.10,0,3.45,.73,5.80,colors.car);
car.box(0,.41,1.75,3.13,.23,1.54,colors.hood);
car.box(0,.82,-.30,2.65,.49,2.85,colors.roof);
car.box(0,.58,1.06,2.53,.26,.32,colors.glass);
car.box(0,.61,-1.51,2.53,.20,.25,colors.glass);
for(const side of [-1,1]){car.box(side*1.48,-.09,-1.9,.24,.21,.30,colors.stripe);car.box(side*1.43,-.03,2.7,.25,.16,.17,[.95,.88,.64]);}
const wheel=meshBuilder(); wheel.box(0,0,0,.82,.95,1.21,colors.rubber);wheel.box(-.43,0,0,.07,.62,.72,[.37,.41,.42]);
const shadow=meshBuilder();
shadow.quad([-2,0,-3.25],[2,0,-3.25],[2,0,3.25],[-2,0,3.25],[.20,.18,.17]);
let world=[],activeScenario='';const carGpu=gpu(car),wheelGpu=gpu(wheel),shadowGpu=gpu(shadow);
function perspective(fovy,aspect,near,far){const f=1/Math.tan(fovy/2);const m=new Float32Array(16);m[0]=f/aspect;m[5]=f;m[10]=(far+near)/(near-far);m[11]=-1;m[14]=2*far*near/(near-far);return m;}
const renderObj={lastGlError:0};
let cameraX=0,cameraZ=0,cameraY=0,initialized=false;
function resetCamera(s){cameraX=s.x;cameraZ=s.z;cameraY=s.road.centerY(s.z);initialized=true;}
function render(s,elapsed){
 if(activeScenario!==s.scenario){
  for(const m of world){gl.deleteBuffer(m.buf);gl.deleteVertexArray(m.vao);}
  world=makeTerrain(s.road);activeScenario=s.scenario;initialized=false;
 }
 const W=window.innerWidth,H=window.innerHeight,dpr=Math.min(window.devicePixelRatio||1,1.50);
 const dw=Math.round(W*dpr),dh=Math.round(H*dpr);
 if(canvas.width!==dw||canvas.height!==dh){canvas.width=dw;canvas.height=dh;}
 gl.viewport(0,0,dw,dh);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);
 gl.clearColor(.14,.22,.19,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 if(!initialized){cameraX=s.x;cameraZ=s.z;cameraY=s.road.centerY(s.z);initialized=true;}
 const follow=1-Math.exp(-Math.min(elapsed||0,.05)*12);
 cameraX+=(s.x-cameraX)*follow;cameraZ+=(s.z-cameraZ)*follow;
 // Camera follows the *road*, not car height. This preserves visible flight gap.
 const groundY=s.road.centerY(cameraZ);
 cameraY+=(groundY-cameraY)*(1-Math.exp(-Math.min(elapsed||0,.05)*2.0));
 const sign=s.dir;
 const eye=[cameraX+10,cameraY+20,cameraZ-sign*43];
 const target=[cameraX,cameraY+2,cameraZ+sign*22];
 const view=lookAt(eye,target),proj=perspective((H>W?48:54)*Math.PI/180,W/H,.5,800);
 gl.useProgram(program);gl.uniformMatrix4fv(loc.projection,false,proj);gl.uniformMatrix4fv(loc.view,false,view);
 const I=identity();for(const m of world){gl.uniformMatrix4fv(loc.model,false,I);gl.bindVertexArray(m.vao);gl.drawArrays(gl.TRIANGLES,0,m.count);}
 function draw(m,mat){gl.uniformMatrix4fv(loc.model,false,mat);gl.bindVertexArray(m.vao);gl.drawArrays(gl.TRIANGLES,0,m.count);}
 // Real ground shadow at the ground surface. It is NOT a height animation.
 const shadowMat=multiply(multiply(translate(s.x,s.road.centerY(s.z)+.065,s.z),yaw(s.heading)),roll(Math.atan(s.road.bank(s.z))));draw(shadowGpu,shadowMat);
 // Every vehicle component uses the same rigid-body pose.
 const pose=multiply(multiply(multiply(translate(s.x,s.y,s.z),yaw(s.heading)),roll(s.roll)),pitch(s.pitch));
 draw(carGpu,pose);
 for(let i=0;i<P.physics.WHEELS.length;i++){
  const w=P.physics.WHEELS[i],ly=P.physics.MOUNT-s.wheelLengths[i];
  draw(wheelGpu,multiply(pose,translate(w.side,ly,w.front)));
 }
 gl.bindVertexArray(null);
 renderObj.lastGlError=gl.getError();
}
window.CrestRender={render,resetCamera,stats:renderObj};document.documentElement.classList.add('webgl-ready');
})();
</script>
<script>(() => {
'use strict';
const P=window.CrestProof,el=id=>document.getElementById(id);
let scenario='jump',speed=150,reverse=false,state=P.fresh({scenario,speed,reverse}),running=false,prev=performance.now(),acc=0;
let frameSeconds=0,frames=0,fps=0,displayTimer=0;
const ctx=el('profile').getContext('2d');
function syncButtons(){for(const b of document.querySelectorAll('[data-scenario]'))b.classList.toggle('chosen',b.dataset.scenario===scenario);
 for(const b of document.querySelectorAll('[data-speed]'))b.classList.toggle('chosen',Number(b.dataset.speed)===speed);
 for(const b of document.querySelectorAll('[data-direction]'))b.classList.toggle('chosen',(b.dataset.direction==='reverse')===reverse);}
function reset(){running=false;state=P.fresh({scenario,speed,reverse});window.CrestRender?.resetCamera?.(state);
 acc=0;prev=performance.now();el('start').textContent='START';
 el('result').textContent=P.settings[scenario].detail;syncButtons();updateLabels();drawProfile();}
function choose(options){
 if(options.scenario)scenario=options.scenario;
 if(options.speed)speed=options.speed;
 if(typeof options.reverse==='boolean')reverse=options.reverse;
 reset();}
function start(){reset();running=true;el('start').textContent='AJOSSA';}
function stop(){running=false;el('start').textContent='START AGAIN';
 const s=state;
 el('result').textContent=s.takeoffs
   ?`Hyppyjä ${s.takeoffs} · laskeutumisia ${s.landings} · lento ${s.airSeconds.toFixed(2)} s · max ${s.maxGap.toFixed(2)} m`
   :`Ei hyppyä · enimmäisroll ${(s.maxRoll*180/Math.PI).toFixed(1)}° · pyöräkontaktit säilyivät`;}
for(const b of document.querySelectorAll('[data-scenario]'))b.addEventListener('click',()=>choose({scenario:b.dataset.scenario}));
for(const b of document.querySelectorAll('[data-speed]'))b.addEventListener('click',()=>choose({speed:Number(b.dataset.speed)}));
for(const b of document.querySelectorAll('[data-direction]'))b.addEventListener('click',()=>choose({reverse:b.dataset.direction==='reverse'}));
el('start').addEventListener('click',start);el('reset').addEventListener('click',reset);
window.addEventListener('keydown',e=>{if(e.code==='Enter'||e.code==='KeyR')start();});
function updateLabels(){const road=state.road;
 const gap=Math.max(0,state.y-1.08-road.centerY(state.z));
 el('state').textContent=state.airborne?'ILMASSA':'TIELLÄ';el('state').dataset.air=state.airborne?'yes':'no';
 el('gap').textContent=gap.toFixed(2)+' m';el('contacts').textContent=String(state.contacts)+'/4';
 el('air').textContent=state.airSeconds.toFixed(2)+' s';el('speed').textContent=String(state.displaySpeed);
 el('pitch').textContent=(state.pitch*180/Math.PI).toFixed(1)+'°';
 el('roll').textContent=(state.roll*180/Math.PI).toFixed(1)+'°';el('fps').textContent=window.CrestRender?String(Math.round(fps)):'–';}
function drawProfile(){const c=el('profile'),w=c.width,h=c.height,road=state.road;
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#0d201d';ctx.fillRect(0,0,w,h);
 const span=state.scenario==='jump'?94:112,from=state.z-span/2,to=state.z+span/2;
 const Y=(y)=>h*.70-(y-road.centerY(state.z))*2.4;
 const X=(z)=>(z-from)/span*w;
 ctx.strokeStyle='#9eac93';ctx.lineWidth=2;ctx.beginPath();
 for(let i=0;i<=130;i++){const z=from+span*i/130,pt=[X(z),Y(road.centerY(z))];if(i===0)ctx.moveTo(...pt);else ctx.lineTo(...pt);}ctx.stroke();
 const carY=Y(state.y);ctx.fillStyle='#f7a458';ctx.fillRect(w/2-7,carY-3,14,6);
 ctx.fillStyle='#cad4c7';ctx.font='9px system-ui';
 ctx.fillText(state.scenario==='bank'?'KAAREVA TIE · CAMBER KORISSA':'TIEN PITUUSPROFIILI + AUTON KORKEUS',7,13);
}
function tick(now){const dt=Math.min(.045,Math.max(0,(now-prev)/1000||0));prev=now;
 if(running){acc+=dt;let steps=0;
  while(acc>=P.dt&&steps++<7){P.step(state);acc-=P.dt;}
  if(Math.abs(state.z)>177)stop();
 }
 if(window.CrestRender)window.CrestRender.render(state,dt);
 frameSeconds+=dt;frames++;
 if(frameSeconds>=.5){fps=frames/frameSeconds;frameSeconds=0;frames=0;}
 displayTimer+=dt;if(displayTimer>.1){displayTimer=0;updateLabels();drawProfile();}
 requestAnimationFrame(tick);
}
window.GOPS_ROADLAB={getSnapshot:()=>({scenario,speed,reverse,airborne:state.airborne,contacts:state.contacts,takeoffs:state.takeoffs,landings:state.landings,maxGap:state.maxGap,maxAirDuration:state.maxAirDuration,airSeconds:state.airSeconds,roll:state.roll,pitch:state.pitch,z:state.z,x:state.x,fps,renderer:!!window.CrestRender,glError:window.CrestRender?.stats.lastGlError||0}),start,reset,choose,stepN:n=>{for(let i=0;i<n;i++)P.step(state);updateLabels();drawProfile();}};
reset();requestAnimationFrame(tick);
const params=new URLSearchParams(location.search);
if(params.has('auto')){choose({scenario:P.settings[params.get('auto')]?params.get('auto'):'jump',speed:[65,150,195].includes(+params.get('speed'))?+params.get('speed'):150,reverse:params.get('direction')==='reverse'});start();}
})();</script>
